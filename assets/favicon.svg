<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C9A1" />
      <stop offset="50%" stop-color="#D6B98C" />
      <stop offset="100%" stop-color="#B8965E" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#221F1F" />
      <stop offset="100%" stop-color="#121010" />
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="3,2" opacity="0.6" />
  
  <!-- Stylized Monogram 'H' & Botanical Leaf Crown -->
