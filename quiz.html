<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bespoke Hair Diagnostic Quiz — HAIRÉA Cosmetics Atelier</title>
  <meta name="description" content="Take our interactive hair-type and scalp diagnostic quiz to generate your custom bio-molecular hair formulation stamped with your custom monogram.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- Quiz Banner -->
  <section class="py-5 bg-secondary border-bottom">
    <div class="container-fluid px-lg-5 py-2">
      <div class="max-w-700 mx-auto text-center">
        <span class="editorial-tag">Trichology Bio-Diagnostics</span>
        <h1 class="editorial-heading-lg mt-2 mb-2">The Hair Diagnostic Ritual</h1>
        <p class="text-secondary lead">
          7 targeted questions analyzing your strand caliber, cuticle porosity, and scalp microbiome to blend your bespoke clean formulation.
        </p>
      </div>
    </div>
  </section>

  <!-- Quiz Engine Workspace -->
  <section class="py-5" style="min-height: 75vh;">
    <div class="container-fluid px-lg-5">
      <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8" id="quizMainWrapper">
          
          <!-- Progress Tracker Bar -->
          <div class="glass-card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="small fw-bold text-uppercase" id="quizStepNumber" style="letter-spacing: 0.15em; color: var(--accent-champagne-dark);">Step 01 of 07</span>
              <span class="small text-muted">Estimated time: 2 mins</span>
            </div>
            <div class="quiz-progress-bar-container rounded-pill overflow-hidden">
              <div class="quiz-progress-fill" id="quizProgressFill" style="width: 14%;"></div>
            </div>
          </div>

          <!-- Dynamic Quiz Question Container -->
          <div class="glass-card p-4 p-md-5 mb-4 shadow-luxe" id="quizStepContainer">
            <!-- Step contents injected via js/quiz.js -->
          </div>

          <!-- Navigation Controls -->
          <div class="d-flex justify-content-between align-items-center">
            <button class="btn btn-hairea-outline px-4" onclick="QuizEngine.prevStep()">
              ← Previous Step
            </button>
            <button class="btn btn-hairea-gold px-5 py-3" onclick="QuizEngine.nextStep()">
              Continue →
            </button>
          </div>

        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      QuizEngine.init();
    });
  </script>
</body>
</html>
