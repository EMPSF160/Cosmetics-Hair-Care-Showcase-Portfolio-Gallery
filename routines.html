<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Hair Care Routines — HAIRÉA Atelier</title>
  <meta name="description" content="Step-by-step trichological routines curated for curly, straight, wavy, chemically damaged, and oily scalp hair types.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- Routines Banner -->
  <section class="py-5 bg-secondary border-bottom">
    <div class="container-fluid px-lg-5 py-3">
      <div class="max-w-700">
        <span class="editorial-tag">Synchronized Formulations</span>
        <h1 class="editorial-heading-lg mt-2 mb-3">Hair Care Rituals</h1>
        <p class="text-secondary lead">
          Achieving salon-level hair transformation requires the right sequence of molecular absorption. Explore our expert-tested routines for every strand pattern.
        </p>
      </div>
    </div>
  </section>

  <!-- Routines Showcase -->
  <section class="py-5">
    <div class="container-fluid px-lg-5">
      <!-- Routine Selector Navigation Tabs -->
      <ul class="nav nav-pills nav-fill mb-5 p-2 glass-card rounded-pill" id="routinesTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active rounded-pill fw-bold text-uppercase small" data-bs-toggle="pill" data-bs-target="#tab-curly">
            01. Curly & Coily Revival
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold text-uppercase small" data-bs-toggle="pill" data-bs-target="#tab-damaged">
            02. Cellular Bond Repair
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold text-uppercase small" data-bs-toggle="pill" data-bs-target="#tab-scalp">
            03. Scalp Microbiome Detox
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill fw-bold text-uppercase small" data-bs-toggle="pill" data-bs-target="#tab-straight">
            04. Glass Silk Lamination
          </button>
        </li>
      </ul>

      <!-- Tab Panes -->
      <div class="tab-content" id="routinesTabContent">
        <!-- Injected via JavaScript from INITIAL_ROUTINES -->
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const routines = Storage.getRoutines();
      const tabContent = document.getElementById("routinesTabContent");
      const tabIds = ["curly", "damaged", "scalp", "straight"];

      tabContent.innerHTML = routines.map((r, idx) => `
        <div class="tab-pane fade ${idx === 0 ? 'show active' : ''}" id="tab-${tabIds[idx]}">
          <div class="row g-5 align-items-center mb-5">
            <div class="col-lg-6" data-aos="fade-right">
              <span class="editorial-tag">${r.hairType}</span>
              <h2 class="editorial-heading-md mt-1 mb-3">${r.name}</h2>
              <p class="lead text-secondary mb-3">${r.tagline}</p>
              <div class="p-3 bg-secondary rounded-3 mb-4">
                <span class="small text-muted d-block">Ideal Candidate:</span>
                <strong>${r.idealFor}</strong>
                <div class="mt-2 small text-muted">
                  <span>⏱ Total Routine Time: <strong>${r.duration}</strong></span>
                </div>
              </div>

              <!-- Bundle Pricing & Buy Action -->
              <div class="glass-card p-4 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                <div>
                  <span class="small text-muted d-block">Complete Ritual Bundle:</span>
                  <div class="d-flex align-items-baseline gap-2">
                    <span class="fs-3 fw-bold">${App.formatPrice(r.bundlePrice)}</span>
                    <span class="text-decoration-line-through text-muted small">${App.formatPrice(r.originalPrice)}</span>
                    <span class="badge bg-danger text-white">${r.savings}</span>
                  </div>
                </div>
                <button class="btn btn-hairea-gold py-3 px-4" onclick="addRoutineBundle('${r.id}')">
                  Add Full Routine to Bag
                </button>
              </div>
            </div>

            <div class="col-lg-6" data-aos="fade-left">
              <div class="routine-image-box shadow-luxe">
                <img src="${r.bannerImage || r.image}" alt="${r.name}">
              </div>
            </div>
          </div>

          <!-- Step by Step Sequence -->
          <div class="border-top pt-5">
            <h3 class="font-serif mb-4">Sequential Ritual Steps</h3>
            <div class="row g-4">
              ${r.steps.map(s => `
                <div class="col-md-6 col-lg-3">
                  <div class="routine-step-card h-100 d-flex flex-column">
                    <div class="routine-step-number">0${s.step}</div>
                    <h5 class="font-serif mb-2">${s.title}</h5>
                    <p class="small text-secondary mb-3 flex-grow-1">${s.instruction}</p>
                    <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center small text-muted">
                      <span>Application</span>
                      <strong>${s.time}</strong>
                    </div>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `).join("");

      if (window.lucide) lucide.createIcons();
    });

    function addRoutineBundle(routineId) {
      const routine = Storage.getRoutines().find(r => r.id === routineId);
      if (!routine) return;
      
      const allProducts = Storage.getProducts();
      routine.productIds.forEach(id => {
        const prod = allProducts.find(p => p.id === id);
        if (prod) {
          App.addToCart(prod, false);
        }
      });
      App.toast(`Added the complete ${routine.name} routine to your bag with bundle savings!`);
    }
  </script>
</body>
</html>
