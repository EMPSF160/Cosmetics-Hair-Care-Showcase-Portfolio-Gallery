<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hair Journal & Trichology Gazette — HAIRÉA Atelier</title>
  <meta name="description" content="Explore evidence-based hair biology guides, ingredient breakdowns, styling tutorials, and trichologist masterclasses.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div id="header-placeholder"></div>

  <!-- Journal Banner -->
  <section class="py-5 bg-secondary border-bottom">
    <div class="container-fluid px-lg-5 py-3">
      <div class="max-w-700">
        <span class="editorial-tag">Trichology Gazette</span>
        <h1 class="editorial-heading-lg mt-2 mb-3">The Hair Journal</h1>
        <p class="text-secondary lead">
          Clinical investigations into strand chemistry, bio-identical peptide mechanisms, and master styling rituals written by cosmetic formulators and trichologists.
        </p>
      </div>
    </div>
  </section>

  <!-- Journal Post Grid -->
  <section class="py-5">
    <div class="container-fluid px-lg-5">
      <div class="row g-5" id="journalMainGrid">
        <!-- Rendered via JS -->
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const posts = Storage.getJournal();
      const container = document.getElementById("journalMainGrid");
      if (!container) return;

      container.innerHTML = posts.map(post => `
        <div class="col-lg-4 col-md-6" data-aos="fade-up">
          <article class="glass-card overflow-hidden h-100 d-flex flex-column text-center align-items-center">
            <div class="journal-card-img-wrapper w-100">
              <img src="${post.image}" alt="${post.title}">
            </div>
            <div class="p-4 p-md-5 d-flex flex-column flex-grow-1 align-items-center text-center w-100">
              <div class="d-flex justify-content-center align-items-center gap-2 small text-muted mb-2">
                <span class="editorial-tag" style="font-size: 0.65rem;">${post.category}</span>
                <span>• ${post.readTime}</span>
              </div>
              <h3 class="font-serif mb-3 text-center">${post.title}</h3>
              <p class="small text-secondary mb-4 flex-grow-1 text-center" style="max-width: 90%;">${post.excerpt}</p>
              
              <div class="border-top pt-3 d-flex justify-content-between align-items-center text-muted small mt-auto w-100">
                <span>By ${post.author}</span>
                <span class="badge bg-secondary text-dark">${post.date}</span>
              </div>
            </div>
          </article>
        </div>
      `).join("");

      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
