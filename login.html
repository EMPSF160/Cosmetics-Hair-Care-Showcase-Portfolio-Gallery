<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Authentication — HAIRÉA Atelier</title>
  <meta name="description" content="Sign in or create your private customer account at HAIRÉA to manage custom formulas, subscriptions, and orders.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page-body" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; background: radial-gradient(circle at 50% 20%, rgba(214, 185, 140, 0.15), transparent 70%), var(--bg-primary);">

  <!-- Top bar minimal back navigation -->
  <div class="position-absolute top-0 start-0 w-100 p-3 p-md-4 d-flex justify-content-between align-items-center" style="z-index: 10;">
    <a href="index.html" class="btn btn-sm btn-hairea-outline d-inline-flex align-items-center gap-2 rounded-pill px-3 py-2" title="Return to Storefront">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> <span>Back to Home</span>
    </a>
    <a href="index.html" class="brand-logo text-decoration-none fs-4">
      HAIRÉA
    </a>
  </div>

  <main class="py-5 my-auto">
    <div class="container-fluid px-3 px-sm-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="glass-card p-4 p-md-5 shadow-luxe" data-aos="fade-up">
            
            <!-- Centered Clickable Brand Logo & Heading -->
            <div class="text-center mb-4">
              <a href="index.html" class="brand-logo text-decoration-none d-inline-flex flex-column align-items-center mb-2" title="Return to Home">
                HAIRÉA
                <span>Cosmetics Atelier</span>
              </a>
              <span class="editorial-tag d-block mt-1">Atelier Privé</span>
              <h3 class="font-serif mt-2 mb-1">Customer Portal</h3>
              <p class="text-muted small mb-0">Access your bespoke hair diagnostic profile & subscriptions</p>
            </div>

            <!-- Social Sign-In Buttons -->
            <div class="d-flex flex-column gap-2 mb-4">
              <button type="button" class="btn btn-hairea-outline w-100 py-2 d-flex align-items-center justify-content-center gap-2 rounded-pill" onclick="handleSocialAuth('Google')">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span class="small fw-semibold">Continue with Google</span>
              </button>

              <button type="button" class="btn btn-hairea-outline w-100 py-2 d-flex align-items-center justify-content-center gap-2 rounded-pill" onclick="handleSocialAuth('Apple')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.61 1.34-.55.63-1.03 1.66-.9 2.69 1 .08 2.01-.48 2.59-1.18z"/>
                </svg>
                <span class="small fw-semibold">Continue with Apple</span>
              </button>
            </div>

            <!-- Divider -->
            <div class="d-flex align-items-center mb-4">
              <div class="flex-grow-1 border-top"></div>
              <span class="px-3 text-muted small text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.08em;">or with email</span>
              <div class="flex-grow-1 border-top"></div>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 bg-secondary rounded-pill" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active rounded-pill text-uppercase small" data-bs-toggle="pill" data-bs-target="#loginTab">Sign In</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill text-uppercase small" data-bs-toggle="pill" data-bs-target="#registerTab">Register</button>
              </li>
            </ul>

            <div class="tab-content">
              <!-- Login Tab -->
              <div class="tab-pane fade show active" id="loginTab">
                <form onsubmit="handleAuthLogin(event)">
                  <div class="mb-3">
                    <label class="form-label small text-muted">Email Address</label>
                    <input type="email" id="authEmail" class="form-control rounded-pill px-3" value="genevieve.moreau@editorial.com" required>
                  </div>
                  <div class="mb-3">
                    <div class="d-flex justify-content-between">
                      <label class="form-label small text-muted">Password</label>
                      <a href="#" class="small text-muted" onclick="App.toast('Password reset link sent to demo email!')">Forgot?</a>
                    </div>
                    <div class="position-relative">
                      <input type="password" id="authPass" class="form-control rounded-pill px-3 pe-5" value="password123" required>
                      <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent p-1 text-muted" onclick="togglePassVisibility('authPass', this)" aria-label="Toggle password visibility">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                      </button>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-hairea-gold w-100 py-3 mb-3 rounded-pill">
                    Sign In to Atelier
                  </button>
                </form>
              </div>

              <!-- Register Tab -->
              <div class="tab-pane fade" id="registerTab">
                <form onsubmit="handleAuthRegister(event)">
                  <div class="mb-3">
                    <label class="form-label small text-muted">Full Name</label>
                    <input type="text" id="regFullName" class="form-control rounded-pill px-3" placeholder="Elena Rostova" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small text-muted">Email Address</label>
                    <input type="email" id="regEmailField" class="form-control rounded-pill px-3" placeholder="elena@paris.com" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small text-muted">Create Password</label>
                    <div class="position-relative">
                      <input type="password" id="regPasswordField" class="form-control rounded-pill px-3 pe-5" placeholder="Minimum 8 characters" required minlength="6">
                      <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent p-1 text-muted" onclick="togglePassVisibility('regPasswordField', this)" aria-label="Toggle password visibility">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                      </button>
                    </div>
                  </div>

                  <!-- Terms & Conditions and Privacy Policy Checkbox -->
                  <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="regAgreeTerms" required>
                    <label class="form-check-label small text-muted" for="regAgreeTerms">
                      I agree to the <a href="#" class="text-decoration-underline text-reset fw-semibold" onclick="event.preventDefault(); App.toast('Terms & Conditions: Standard Editorial Atelier terms applied.');">Terms & Conditions</a> and <a href="#" class="text-decoration-underline text-reset fw-semibold" onclick="event.preventDefault(); App.toast('Privacy Policy: We protect customer formula DNA.');">Privacy Policy</a>.
                    </label>
                  </div>

                  <button type="submit" class="btn btn-hairea-gold w-100 py-3 mb-3 rounded-pill">
                    Create Account (+100 Points)
                  </button>
                </form>
              </div>
            </div>

            <div class="border-top pt-3 text-center">
              <a href="admin.html" class="small text-muted">Are you a Salon Administrator? Access Studio Admin →</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPass = input.type === "password";
      input.type = isPass ? "text" : "password";
      btn.innerHTML = `<i data-lucide="${isPass ? 'eye-off' : 'eye'}" style="width: 18px; height: 18px;"></i>`;
      if (window.lucide) lucide.createIcons();
    }

    function handleSocialAuth(provider) {
      App.toast(`Authenticated with ${provider}! Redirecting...`);
      setTimeout(() => window.location.href = "account.html", 500);
    }

    function handleAuthLogin(e) {
      e.preventDefault();
      App.toast("Welcome back, Genevieve!");
      setTimeout(() => window.location.href = "account.html", 500);
    }

    function handleAuthRegister(e) {
      e.preventDefault();
      const terms = document.getElementById("regAgreeTerms");
      if (terms && !terms.checked) {
        App.toast("Please accept the Terms & Conditions and Privacy Policy.");
        return;
      }

      const name = document.getElementById("regFullName").value;
      const email = document.getElementById("regEmailField").value;
      Storage.setUser({
        name: name,
        email: email,
        tier: "Silver Atelier Member",
        points: 100,
        hairProfile: "Complete diagnostic to customize",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80"
      });
      App.toast("Account registered! 100 Reward Points earned.");
      setTimeout(() => window.location.href = "account.html", 500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
      if (window.AOS) AOS.init({ duration: 600, once: true });
    });
  </script>
</body>
</html>
